  <style>
    @font-face {
      font-family: "Nunito";
      font-weight: 400 800;
      font-display: swap;
      src: url("nunito-latin.woff2") format("woff2");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: grid;
      margin: 0;
      grid-template-rows: 1fr auto;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        linear-gradient(rgba(205, 199, 242, 0.05) 1px, transparent 1px) 0 0 / 24px 24px,

      color: #E8ECF5;
      font-family: "Nunito", "Avenir Next", "Avenir", "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }

    main {
      display: grid;
      justify-items: center;
      gap: 1.5rem;
    }

    .mark {
      width: min(16rem, 56vw);
      height: auto;
    }

    h1 {
      margin: -0.5rem 0 0;
      font-size: clamp(3rem, 12vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .promise {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    h1 span {
      color: #F3C56E;
    }

    .tagline {
      margin: 0;
      color: #CDC7F2;
      font-size: 1.125rem;
    }

    .cta {
      margin-top: 1rem;
      padding: 0.9rem 1.75rem;
      border-radius: 999px;
      background: #8EA9F2;
      color: #0B132B;
      font-size: 1.125rem;
      font-weight: 800;
      text-decoration: none;
    }

    .cta:hover {
      background: #CDC7F2;
    }

    footer {
      padding-top: 2rem;
      color: #8A93A6;
      font-size: 0.75rem;
      line-height: 1.6;
    }

    .cta:focus-visible {
      outline: 3px solid #F3C56E;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="tiloissa-tunnus">
      <path d="M14 46 L50 16 L86 46 L86 86 L14 86 Z" fill="#E8ECF5" stroke="#E8ECF5" stroke-width="10"

      <polyline points="31,62 45,75 70,50" fill="none" stroke="#1C2A4A" stroke-width="10" stroke-linecap="round"

    <p class="promise">Hyvää elämää</p>
    <h1>tiloissa<span>.</span></h1>
    <p class="tagline">Jokaisella oma vuoronsa.</p>
    <a class="cta" href="https://tiloissa-app.laatikaj.workers.dev/">Avaa sovellus</a>
  </main>
  <footer>Copyright &copy; <span id="currentYear">2026</span> laatikaj. All rights reserved.</footer>
